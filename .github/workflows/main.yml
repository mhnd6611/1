name: 24/7 Master Multi-Streamer Broadcast

on:
  workflow_dispatch:
    inputs:
      restream_key:
        required: false
        default: 're_12416925_event6f6e2607a46347b59efab0c722ed3e53'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v3

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v1

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-sil-scheherazade fontconfig libass-dev
          pip3 install --user -q --upgrade streamlink
          sudo fc-cache -f >/dev/null 2>&1

      - name: PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Self-schedule 5h30m
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RKEY="${{ github.event.inputs.restream_key || 're_12416925_event6f6e2607a46347b59efab0c722ed3e53' }}"
          setsid nohup bash -c "
            sleep 19800
            gh workflow run main.yml --ref '${{ github.ref_name }}' -f restream_key='$RKEY'
          " >/tmp/sched.log 2>&1 < /dev/null &
          echo "OK"

      - name: Broadcast
        env:
          RESTREAM_KEY: ${{ github.event.inputs.restream_key || 're_12416925_event6f6e2607a46347b59efab0c722ed3e53' }}
          STREAMERS_LIST: 'drb7h,S5B,ABO8ALYY,ID7O,F1AISAL,abo_khrbaa,Peerless,Seagull,iMonkey_D,FHLWY,aymnalsatam,IB6H,W1pey,ALRND,Hook,okb8'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x stream.sh
          ./stream.sh
