name: SXB 24-7 Seamless Handoff

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: تثبيت الأدوات والخطوط (مقاوم للتعليق)
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          timeout 180 sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120 update -qq
          install_ok=0
          for attempt in 1 2 3; do
            if timeout 300 sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends ffmpeg fontconfig libraqm0 libfribidi0; then
              install_ok=1; break
            fi
            echo "⚠️ محاولة ffmpeg $attempt فشلت. إعادة محاولة..."; sleep 5
          done
          [ "$install_ok" -eq 1 ] || { echo "❌ فشل تثبيت ffmpeg"; exit 1; }
          pip3 install --user --break-system-packages --quiet --upgrade Pillow streamlink
          mkdir -p ~/.fonts
          for URL in \
            "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"; do
            curl -sL --max-time 30 "$URL" -o ~/.fonts/Cairo-var.ttf 2>/dev/null || true
            [ "$(stat -c%s ~/.fonts/Cairo-var.ttf 2>/dev/null || echo 0)" -gt 50000 ] && break
          done
          for URL in \
            "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/orbitron/Orbitron%5Bwght%5D.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf"; do
            curl -sL --max-time 30 "$URL" -o ~/.fonts/Orbitron-var.ttf 2>/dev/null || true
            [ "$(stat -c%s ~/.fonts/Orbitron-var.ttf 2>/dev/null || echo 0)" -gt 20000 ] && break
          done
          fc-cache -f >/dev/null 2>&1

      - name: PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: جدولة الرن التالي (بعد 5س20د)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setsid nohup bash -c "
            sleep 19200
            gh workflow run main.yml --ref '${{ github.ref_name }}'
          " >/tmp/sched.log 2>&1 < /dev/null &
          echo "✅ تم جدولة الرن التالي"

      - name: تشغيل البث مع التسليم والتسلّم
        env:
          RESTREAM_KEY: 're_12215822_event7443f45547114c8aaf6a9153b0da6831'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x stream.sh
          ./stream.sh
