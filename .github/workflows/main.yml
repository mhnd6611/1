name: 24/7 Kick Broadcaster

on:
  workflow_dispatch:
    inputs:
      streamers_list:
        required: true
        default: 'drb7h,S5B,ABO8ALYY,ID7O,F1AISAL,abo_khrbaa,Peerless,Seagull,iMonkey_D,FHLWY,aymnalsatam,IB6H,W1pey,ALRND,Hook,okb8'
      youtube_key:
        required: false
        default: ''
      restream_key:
        required: false
        default: 're_12416925_event6f6e2607a46347b59efab0c722ed3e53'
      destination:
        required: true
        default: 'restream'
      quality:
        required: true
        default: 'best'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

jobs:
  broadcaster:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز البيئة (ffmpeg + fonts + streamlink)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fontconfig libass-dev
          sudo fc-cache -f > /dev/null 2>&1
          python3 -m pip install --no-cache-dir --quiet streamlink
          which ffmpeg && ffmpeg -version | head -n 1
          fc-list : family | grep -i "Noto Naskh" && echo "Font OK"

      - name: التسليم — إلغاء الرون القديم (بدون إفشال الرون الجديد)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_RUN_ID="${{ github.run_id }}"
          OLD_RUN_ID=$(gh run list --workflow=main.yml --limit 20 \
            --json databaseId,status \
            --jq ".[] | select(.status != \"completed\") | select(.databaseId < $CURRENT_RUN_ID) | .databaseId" | head -n 1 || true)

          if [ -n "$OLD_RUN_ID" ]; then
            echo "⚡ إلغاء الرون القديم: $OLD_RUN_ID"
            gh run cancel "$OLD_RUN_ID" 2>/dev/null || true
            WAIT=0
            while [ "$WAIT" -lt 30 ]; do
              STATUS=$(gh run view "$OLD_RUN_ID" --json status --jq '.status' 2>/dev/null || echo "completed")
              [ "$STATUS" = "completed" ] && { echo "✅ انتهى بعد ${WAIT}s"; break; }
              sleep 2
              WAIT=$((WAIT + 2))
            done
            echo "⏳ انتظار 8s لتحرير مفتاح Restream..."
            sleep 8
          else
            echo "لا يوجد رون قديم"
          fi

      - name: تشغيل البث
        env:
          STREAMERS_LIST: ${{ github.event.inputs.streamers_list || 'drb7h,S5B,ABO8ALYY,ID7O,F1AISAL,abo_khrbaa,Peerless,Seagull,iMonkey_D,FHLWY,aymnalsatam,IB6H,W1pey,ALRND,hook,okb8' }}
          YOUTUBE_KEY: ${{ github.event.inputs.youtube_key || '' }}
          RESTREAM_KEY: ${{ github.event.inputs.restream_key || 're_12416925_event6f6e2607a46347b59efab0c722ed3e53' }}
          STREAM_DEST: ${{ github.event.inputs.destination || 'restream' }}
          STREAM_QUALITY: ${{ github.event.inputs.quality || 'best' }}
        run: |
          chmod +x stream.sh
          ./stream.sh 
