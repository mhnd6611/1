name: Respect 24-7 Luxury Broadcast

on:
  workflow_dispatch:
    inputs:
      restream_key:
        required: false
        default: 're_12543719_event7def31c9d2d74d1eba5a0bee1a95cde7'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: جلب الملفات
        uses: actions/checkout@v3

      - name: تخزين مؤقت للـ pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-pillow-respect-v1

      - name: تثبيت الأدوات
        run: |
          set -e
          echo "═══ التثبيت ═══"
          
          # 🚀 الحل الجذري: مسح إعدادات Azure وكتابة مسار خوادم Ubuntu الرسمية مباشرة
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo bash -c 'cat <<EOF > /etc/apt/sources.list.d/ubuntu.sources
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF'
          
          echo "⏳ تحديث الحزم وتثبيت ffmpeg..."
          timeout 300 sudo apt-get update -qq || echo "⚠️ تحذير: استغرق تحديث الحزم وقتاً طويلاً..."
          timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fontconfig || echo "⚠️ تحذير: استغرق تثبيت الحزم وقتاً طويلاً..."

          echo "📦 تثبيت Pillow + Streamlink..."
          pip3 install --user --break-system-packages --quiet --upgrade Pillow streamlink

          echo "🔤 تحميل الخطوط..."
          mkdir -p ~/.fonts

          CAIRO_OK=0
          for URL in \
            "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"; do
            curl -sL --max-time 30 "$URL" -o ~/.fonts/Cairo-var.ttf 2>/dev/null || true
            S=$(stat -c%s ~/.fonts/Cairo-var.ttf 2>/dev/null || echo 0)
            if [ "$S" -gt 50000 ]; then
              echo "✅ Cairo ($S بايت)"
              CAIRO_OK=1
              break
            fi
            rm -f ~/.fonts/Cairo-var.ttf
          done
          if [ "$CAIRO_OK" != "1" ]; then
            echo "⚠️ فشل Cairo — استخدام Noto Naskh Arabic"
            curl -sL --max-time 30 "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io@main/fonts/NotoSansArabic/hinted/ttf/NotoSansArabic-Bold.ttf" -o ~/.fonts/Cairo-var.ttf
          fi

          ORB_OK=0
          for URL in \
            "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/orbitron/Orbitron%5Bwght%5D.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf"; do
            curl -sL --max-time 30 "$URL" -o ~/.fonts/Orbitron-var.ttf 2>/dev/null || true
            S=$(stat -c%s ~/.fonts/Orbitron-var.ttf 2>/dev/null || echo 0)
            if [ "$S" -gt 20000 ]; then
              echo "✅ Orbitron ($S بايت)"
              ORB_OK=1
              break
            fi
            rm -f ~/.fonts/Orbitron-var.ttf
          done
          if [ "$ORB_OK" != "1" ]; then
            echo "❌ فشل تحميل Orbitron"
            exit 1
          fi

          fc-cache -f >/dev/null 2>&1
          echo "═══ اكتمل ═══"

      - name: التحقق
        run: |
          echo "ffmpeg: $(which ffmpeg || echo مفقود)"
          echo "PIL: $(python3 -c 'import PIL; print(PIL.__version__)' 2>&1)"
          echo "Cairo: $(ls -la ~/.fonts/Cairo-var.ttf 2>/dev/null | awk '{print $5}') بايت"
          echo "Orbitron: $(ls -la ~/.fonts/Orbitron-var.ttf 2>/dev/null | awk '{print $5}') بايت"
          echo "streamlink: $($HOME/.local/bin/streamlink --version 2>&1)"

      - name: PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: جدولة الرن التالي (بعد 5س30د)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RKEY="${{ github.event.inputs.restream_key || 're_12543719_event7def31c9d2d74d1eba5a0bee1a95cde7' }}"
          setsid nohup bash -c "
            sleep 19800
            gh workflow run main.yml --ref '${{ github.ref_name }}' -f restream_key='$RKEY'
          " >/tmp/sched.log 2>&1 < /dev/null &
          echo "✅ تم جدولة الرن التالي"

      - name: تشغيل البث
        env:
          RESTREAM_KEY: ${{ github.event.inputs.restream_key || 're_12543719_event7def31c9d2d74d1eba5a0bee1a95cde7' }}
          STREAMERS_LIST: 'drb7h,S5B,ABO8ALYY,ID7O,F1AISAL,xmusabrt,TAF86,abo_khrbaa,Peerless,Seagull,iMonkey_D,FHLWY,Hook,okb8,wolf,NASSER,Aymnalsatam,BoQamar,xya7ya,klash'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x stream.sh
          ./stream.sh
