name: 24/7 Master Multi-Streamer Broadcast

on:
  workflow_dispatch:
    inputs:
      restream_key:
        required: false
        default: 're_12416925_event6f6e2607a46347b59efab0c722ed3e53'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: جلب الملفات
        uses: actions/checkout@v3

      - name: تخزين مؤقت للـ pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v1

      - name: تثبيت سريع
        run: |
          echo "🎨 convert: $(which convert 2>/dev/null || echo 'مفقود')"
          echo "📺 ffmpeg: $(which ffmpeg 2>/dev/null || echo 'مفقود')"
          
          echo "🔤 تحميل الخط العربي..."
          mkdir -p ~/.fonts
          FONT_URL="https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf"
          if wget -q --timeout=20 "$FONT_URL" -O ~/.fonts/NotoNaskhArabic-Regular.ttf; then
            echo "✅ تم تحميل الخط مباشرة"
          else
            echo "⚠️ فشل التحميل — استخدام apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-core 2>/dev/null || true
          fi
          
          echo "📦 تثبيت Streamlink..."
          pip3 install --user -q --upgrade streamlink
          
          echo "🔤 تحديث ذاكرة الخطوط..."
          fc-cache -f >/dev/null 2>&1
          echo "✅ اكتمل التثبيت"

      - name: التحقق من الأدوات
        run: |
          echo "════════ التحقق ════════"
          echo "convert:    $(which convert || echo مفقود)"
          echo "ffmpeg:     $(which ffmpeg || echo مفقود)"
          echo "الخط العربي: $(fc-list : family | grep -i 'Noto Naskh' | head -1 || echo مفقود)"
          echo "streamlink: $($HOME/.local/bin/streamlink --version 2>&1 || echo مفقود)"
          echo "═════════════════════════"

      - name: PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: جدولة الرن التالي
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RKEY="${{ github.event.inputs.restream_key || 're_12416925_event6f6e2607a46347b59efab0c722ed3e53' }}"
          echo "⏰ جدولة الرن التالي بعد 5 ساعات و 30 دقيقة"
          setsid nohup bash -c "
            sleep 19800
            gh workflow run main.yml --ref '${{ github.ref_name }}' -f restream_key='$RKEY'
          " >/tmp/sched.log 2>&1 < /dev/null &
          echo "✅ تمت الجدولة"

      - name: تشغيل البث
        env:
          RESTREAM_KEY: ${{ github.event.inputs.restream_key || 're_12416925_event6f6e2607a46347b59efab0c722ed3e53' }}
          STREAMERS_LIST: 'drb7h,S5B,ABO8ALYY,ID7O,F1AISAL,abo_khrbaa,Peerless,Seagull,iMonkey_D,FHLWY,aymnalsatam,IB6H,W1pey,ALRND,Hook,okb8'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          echo "🎬 بدء البث..."
          chmod +x stream.sh
          ./stream.sh
