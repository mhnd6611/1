name: 24/7 Master Multi-Streamer Broadcast

on:
  workflow_dispatch:
    inputs:
      restream_key:
        required: false
        default: 're_12416925_event6f6e2607a46347b59efab0c722ed3e53'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: جلب الملفات
        uses: actions/checkout@v3

      - name: تخزين مؤقت للـ pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-pillow-v2

      - name: تثبيت الأدوات
        run: |
          set -e
          echo "═══ التثبيت ═══"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fontconfig
          
          echo "📦 Pillow + Streamlink..."
          pip3 install --user --break-system-packages --quiet --upgrade Pillow streamlink
          
          echo "🔤 تحميل الخط (عربي + إنجليزي)..."
          mkdir -p ~/.fonts
          FONT="$HOME/.fonts/NotoSansArabic-Bold.ttf"
          FONT_URLS=(
            "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io@main/fonts/NotoSansArabic/hinted/ttf/NotoSansArabic-Bold.ttf"
            "https://cdn.jsdelivr.net/gh/notofonts/arabic@main/fonts/NotoSansArabic/hinted/ttf/NotoSansArabic-Bold.ttf"
            "https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSansArabic/hinted/ttf/NotoSansArabic-Bold.ttf"
            "https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoSansArabic/hinted/ttf/NotoSansArabic-Bold.ttf"
          )
          FONT_OK=0
          for URL in "${FONT_URLS[@]}"; do
            echo "   محاولة: $URL"
            curl -sL --max-time 30 "$URL" -o "$FONT" 2>/dev/null || true
            SIZE=$(stat -c%s "$FONT" 2>/dev/null || echo 0)
            TYPE=$(file -b "$FONT" 2>/dev/null || echo "")
            if [ "$SIZE" -gt 50000 ] && echo "$TYPE" | grep -qiE "TrueType|OpenType|font"; then
              echo "   ✅ صالح ($SIZE بايت، $TYPE)"
              FONT_OK=1
              break
            else
              echo "   ❌ غير صالح ($SIZE بايت، $TYPE)"
              rm -f "$FONT"
            fi
          done
          if [ "$FONT_OK" != "1" ]; then
            echo "❌ فشل تحميل الخط من كل المصادر"
            exit 1
          fi
          
          fc-cache -f >/dev/null 2>&1
          echo "═══ اكتمل ═══"

      - name: التحقق
        run: |
          echo "ffmpeg: $(which ffmpeg || echo مفقود)"
          echo "python3: $(which python3)"
          echo "PIL: $(python3 -c 'import PIL; print(PIL.__version__)' 2>&1)"
          echo "الخط: $(ls -la ~/.fonts/*.ttf 2>/dev/null | head -1)"
          echo "streamlink: $($HOME/.local/bin/streamlink --version 2>&1)"

      - name: PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: جدولة الرن التالي
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RKEY="${{ github.event.inputs.restream_key || 're_12416925_event6f6e2607a46347b59efab0c722ed3e53' }}"
          setsid nohup bash -c "
            sleep 19800
            gh workflow run main.yml --ref '${{ github.ref_name }}' -f restream_key='$RKEY'
          " >/tmp/sched.log 2>&1 < /dev/null &
          echo "✅"

      - name: تشغيل البث
        env:
          RESTREAM_KEY: ${{ github.event.inputs.restream_key || 're_12416925_event6f6e2607a46347b59efab0c722ed3e53' }}
          STREAMERS_LIST: 'drb7h,S5B,ABO8ALYY,ID7O,F1AISAL,xmusabrt,abo_khrbaa,Peerless,Seagull,iMonkey_D,FHLWY,aymnalsatam,IB6H,okb8,Hook,wolf,ALRND,W1pey,RAYAN,Rayan_a3'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x stream.sh
          ./stream.sh
